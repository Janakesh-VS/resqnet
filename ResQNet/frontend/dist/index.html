<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResQNet // Tactical Field Dispatch & Swiss Editorial</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#F4F3EF" />

  <!-- Fonts: Inter Display & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- QR Code Generator library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-stone: #F4F3EF;
      --panel-white: #FFFFFF;
      --text-ink: #111111;
      --text-muted: #57534E;
      --border-crisp: #D6D3CD;
      --border-dark: #A8A29E;
      --rescue-orange: #EA580C;
      --signal-crimson: #DC2626;
      --forest-emerald: #15803D;
      --cobalt-blue: #1D4ED8;
      --amber-alert: #D97706;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-stone);
      color: var(--text-ink);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      letter-spacing: -0.011em;
    }

    .mono {
      font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace;
      letter-spacing: -0.02em;
    }

    /* Crisp structural borders without shadows */
    .border-crisp {
      border: 1px solid var(--border-crisp);
    }
    .border-crisp-b {
      border-bottom: 1px solid var(--border-crisp);
    }
    .border-crisp-t {
      border-top: 1px solid var(--border-crisp);
    }
    .border-crisp-r {
      border-right: 1px solid var(--border-crisp);
    }
    .border-crisp-l {
      border-left: 1px solid var(--border-crisp);
    }

    /* Tactile button styling with 2px hard offset on press */
    .tactile-btn {
      transition: transform 120ms ease, background-color 120ms ease, box-shadow 120ms ease;
      position: relative;
    }
    .tactile-btn:hover {
      box-shadow: 0 1px 0 0 #111111;
    }
    .tactile-btn:active {
      transform: translateY(1.5px);
      box-shadow: 0 0 0 0 transparent;
    }

    .hard-btn-primary {
      background-color: var(--rescue-orange);
      color: #FFFFFF;
      border: 1px solid #C2410C;
    }
    .hard-btn-primary:hover {
      background-color: #C2410C;
    }

    .hard-btn-dark {
      background-color: #1C1917;
      color: #FFFFFF;
      border: 1px solid #0C0A09;
    }
    .hard-btn-dark:hover {
      background-color: #292524;
    }

    .hard-btn-secondary {
      background-color: #FFFFFF;
      color: var(--text-ink);
      border: 1px solid var(--border-dark);
    }
    .hard-btn-secondary:hover {
      background-color: #F5F5F4;
    }

    /* Map styling - CartoDB editorial palette */
    #map {
      height: 100%;
      min-height: 520px;
      width: 100%;
      background: #EAE8E3;
    }

    .leaflet-container {
      background-color: #EAE8E3 !important;
      font-family: 'JetBrains Mono', monospace !important;
    }

    /* Minimalist technical popup */
    .leaflet-popup-content-wrapper {
      background: #FFFFFF !important;
      color: #111111 !important;
      border: 1px solid #1C1917 !important;
      border-radius: 0px !important;
      box-shadow: 2px 2px 0px 0px #1C1917 !important;
      padding: 0 !important;
    }
    .leaflet-popup-content {
      margin: 10px 12px !important;
      line-height: 1.35 !important;
    }
    .leaflet-popup-tip-container {
      display: none !important;
    }

    /* Scrollbars: Minimal industrial */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-stone);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-dark);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Segmented status stepper */
    .step-segment {
      flex: 1;
      text-align: center;
      padding: 6px 2px;
      border-right: 1px solid var(--border-crisp);
      background: #FFFFFF;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .step-segment:last-child {
      border-right: none;
    }
    .step-active {
      background: #FEF3C7;
      color: #92400E;
      border-bottom: 2px solid var(--amber-alert);
    }
    .step-done {
      background: #F0FDF4;
      color: var(--forest-emerald);
      border-bottom: 2px solid var(--forest-emerald);
    }
    .step-pending {
      color: #A8A29E;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-orange-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = window.location.origin;

    // Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.error);
      });
    }

    // Custom Tactical SVG Marker Generator
    function createTacticalIcon(id, type, priority, isSelected) {
      const isCritical = priority === 'Critical';
      const isAnimal = type === 'animal';
      const bg = isCritical ? '#DC2626' : (isAnimal ? '#1D4ED8' : '#EA580C');
      const border = isSelected ? '#111111' : '#FFFFFF';
      const size = isSelected ? 34 : 28;

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 32 32">
          <rect x="2" y="2" width="28" height="28" fill="${bg}" stroke="${border}" stroke-width="${isSelected ? '2.5' : '1.5'}"/>
          <text x="16" y="14" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="7.5" font-weight="700" text-anchor="middle" letter-spacing="-0.5">
            ${isAnimal ? 'VET' : 'MED'}
          </text>
          <text x="16" y="24" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="8" font-weight="800" text-anchor="middle">
            ${id.slice(-3)}
          </text>
        </svg>
      `;

      return L.divIcon({
        html: svg,
        className: 'tactical-marker',
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2]
      });
    }

    function App() {
      const [activeTab, setActiveTab] = useState('coordinator'); // 'coordinator', 'citizen', 'ngo', 'volunteer'
      const [offlineSimulated, setOfflineSimulated] = useState(false);
      const [offlineQueue, setOfflineQueue] = useState([]);
      const [syncMessage, setSyncMessage] = useState('');
      const [requests, setRequests] = useState([]);
      const [selectedRequest, setSelectedRequest] = useState(null);
      const [inventory, setInventory] = useState([]);
      const [volunteers, setVolunteers] = useState([]);
      const [auditLogs, setAuditLogs] = useState({ request_events: [], agent_runs: [] });
      const [auditDrawerOpen, setAuditDrawerOpen] = useState(false);

      // Load offline queue
      useEffect(() => {
        const savedQueue = localStorage.getItem('resqnet_offline_queue');
        if (savedQueue) {
          try {
            setOfflineQueue(JSON.parse(savedQueue));
          } catch(e) {}
        }
      }, []);

      const fetchData = async () => {
        if (offlineSimulated) return;
        try {
          const [reqRes, invRes, volRes, auditRes] = await Promise.all([
            fetch(`${API_BASE}/api/requests`),
            fetch(`${API_BASE}/api/inventory`),
            fetch(`${API_BASE}/api/volunteers`),
            fetch(`${API_BASE}/api/audit-logs?limit=50`)
          ]);
          if (reqRes.ok) {
            const data = await reqRes.json();
            setRequests(data);
            if (!selectedRequest && data.length > 0) {
              setSelectedRequest(data[0]);
            }
          }
          if (invRes.ok) setInventory(await invRes.json());
          if (volRes.ok) setVolunteers(await volRes.json());
          if (auditRes.ok) setAuditLogs(await auditRes.json());
        } catch (err) {
          console.error("Telemetry sync error:", err);
        }
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 4000);
        return () => clearInterval(interval);
      }, [offlineSimulated]);

      // Sync offline queue
      const triggerSync = async () => {
        const saved = JSON.parse(localStorage.getItem('resqnet_offline_queue') || '[]');
        if (saved.length === 0) return;
        setSyncMessage(`TRANSMITTING ${saved.length} LOCAL OFFLINE INCIDENT(S) TO CHIEF COORDINATOR...`);
        for (const item of saved) {
          try {
            await fetch(`${API_BASE}/api/requests`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(item)
            });
          } catch (e) {
            console.error("Sync item failed", e);
          }
        }
        localStorage.removeItem('resqnet_offline_queue');
        setOfflineQueue([]);
        setSyncMessage('OFFLINE BUFFER EMPTIED. ALL PACKETS VERIFIED & INGESTED.');
        setTimeout(() => setSyncMessage(''), 4500);
        fetchData();
      };

      const toggleOfflineMode = () => {
        const next = !offlineSimulated;
        setOfflineSimulated(next);
        if (!next) {
          triggerSync();
        }
      };

      // Metrics calculation
      const criticalCount = requests.filter(r => r.priority === 'Critical').length;
      const approvalNeededCount = requests.filter(r => r.requires_human_review).length;
      const shortagesCount = inventory.filter(i => (i.quantity - (i.reserved_quantity || 0)) <= 10).length;

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          {/* Top Telemetry Strip (48px Swiss Architectural Header) */}
          <header className={`h-12 border-crisp-b flex items-stretch justify-between px-3 text-xs select-none transition-colors duration-200 ${
            offlineSimulated ? 'bg-orange-600 text-white font-medium' : 'bg-white text-stone-900'
          }`}>
            {/* Left Brand Unit */}
            <div className="flex items-center space-x-3 border-crisp-r pr-4">
              <span className="font-extrabold tracking-tight text-sm flex items-center space-x-1.5">
                <span className="w-2.5 h-2.5 bg-stone-900 inline-block"></span>
                <span>RESQNET</span>
              </span>
              <span className={`mono text-[11px] px-1.5 py-0.5 border ${
                offlineSimulated ? 'border-orange-400 bg-orange-700 text-white' : 'border-stone-300 bg-stone-100 text-stone-600'
              }`}>
                OPS-CONSOLE // K4.0
              </span>
            </div>

            {/* Middle Tabular Live Counters */}
            <div className="hidden lg:flex items-center divide-x divide-stone-200 border-crisp-r">
              <div className="px-3.5 py-1 flex items-baseline space-x-1.5">
                <span className={`text-[10px] uppercase font-bold tracking-wider ${offlineSimulated ? 'text-orange-200' : 'text-stone-500'}`}>INCIDENTS</span>
                <span className="mono font-bold text-sm">{requests.length}</span>
              </div>
              <div className="px-3.5 py-1 flex items-baseline space-x-1.5">
                <span className={`text-[10px] uppercase font-bold tracking-wider ${offlineSimulated ? 'text-orange-200' : 'text-red-700'}`}>CRITICAL</span>
                <span className={`mono font-bold text-sm ${offlineSimulated ? 'text-white' : 'text-red-600'}`}>{criticalCount}</span>
              </div>
              <div className="px-3.5 py-1 flex items-baseline space-x-1.5">
                <span className={`text-[10px] uppercase font-bold tracking-wider ${offlineSimulated ? 'text-orange-200' : 'text-amber-700'}`}>AWAITING APPROVAL</span>
                <span className="mono font-bold text-sm">{approvalNeededCount}</span>
              </div>
              <div className="px-3.5 py-1 flex items-baseline space-x-1.5">
                <span className={`text-[10px] uppercase font-bold tracking-wider ${offlineSimulated ? 'text-orange-200' : 'text-stone-500'}`}>STOCK ALERTS</span>
                <span className="mono font-bold text-sm">{shortagesCount}</span>
              </div>
            </div>

            {/* Segmented Role Navigation Tabs */}
            <div className="flex items-center space-x-1 px-2">
              {[
                { id: 'coordinator', label: 'COORDINATOR' },
                { id: 'citizen', label: 'CITIZEN INTAKE' },
                { id: 'ngo', label: 'NGO STOCK' },
                { id: 'volunteer', label: 'FIELD / VET' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={`px-3 py-1 text-[11px] font-bold tracking-wider transition-all tactile-btn ${
                    activeTab === t.id
                      ? (offlineSimulated ? 'bg-white text-orange-950 border border-white' : 'bg-stone-900 text-white')
                      : (offlineSimulated ? 'text-orange-100 hover:bg-orange-700' : 'text-stone-600 hover:bg-stone-100 border border-transparent')
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>

            {/* Right: Tactile Offline Simulator Switch & Audit Drawer */}
            <div className="flex items-center space-x-2 pl-3 border-crisp-l">
              <button
                onClick={toggleOfflineMode}
                className={`flex items-center space-x-2 px-3 py-1 border text-[11px] font-bold mono tactile-btn uppercase ${
                  offlineSimulated
                    ? 'bg-stone-900 text-white border-white animate-pulse'
                    : 'bg-stone-100 text-stone-800 border-stone-300 hover:border-stone-500'
                }`}
                title="Simulate complete field network outage with zero packet drop"
              >
                <span className={`w-2 h-2 ${offlineSimulated ? 'bg-orange-400' : 'bg-emerald-600'}`}></span>
                <span>{offlineSimulated ? `SIMULATED OFFLINE (${offlineQueue.length})` : 'SIMULATE OFFLINE'}</span>
              </button>

              {offlineQueue.length > 0 && !offlineSimulated && (
                <button
                  onClick={triggerSync}
                  className="bg-emerald-700 hover:bg-emerald-800 text-white text-[11px] font-bold mono px-2.5 py-1 tactile-btn"
                >
                  SYNC [{offlineQueue.length}]
                </button>
              )}

              <button
                onClick={() => setAuditDrawerOpen(true)}
                className={`px-2.5 py-1 text-[11px] font-bold mono border tactile-btn ${
                  offlineSimulated ? 'border-orange-400 bg-orange-700 text-white' : 'border-stone-300 bg-white text-stone-700 hover:bg-stone-50'
                }`}
              >
                AUDIT LOG
              </button>
            </div>
          </header>

          {/* Offline Sync Banner */}
          {syncMessage && (
            <div className="bg-stone-900 text-stone-100 mono text-xs px-4 py-2 border-crisp-b flex items-center justify-between">
              <span className="flex items-center space-x-2">
                <span className="w-2 h-2 bg-emerald-400 inline-block animate-ping"></span>
                <span>{syncMessage}</span>
              </span>
              <button onClick={() => setSyncMessage('')} className="text-stone-400 hover:text-white font-mono">&times;</button>
            </div>
          )}

          {/* Role Views */}
          <main className="flex-1 flex flex-col">
            {activeTab === 'coordinator' && (
              <CoordinatorCommandView
                requests={requests}
                selectedRequest={selectedRequest}
                onSelectRequest={setSelectedRequest}
                inventory={inventory}
                volunteers={volunteers}
                onRefresh={fetchData}
              />
            )}
            {activeTab === 'citizen' && (
              <CitizenIntakeView
                offlineSimulated={offlineSimulated}
                onQueueOffline={(report) => {
                  const updated = [...offlineQueue, report];
                  setOfflineQueue(updated);
                  localStorage.setItem('resqnet_offline_queue', JSON.stringify(updated));
                }}
                onRefresh={fetchData}
              />
            )}
            {activeTab === 'ngo' && (
              <NGOInventoryLedger inventory={inventory} onRefresh={fetchData} />
            )}
            {activeTab === 'volunteer' && (
              <VolunteerVetFieldApp volunteers={volunteers} onRefresh={fetchData} />
            )}
          </main>

          {/* Audit Log Drawer */}
          {auditDrawerOpen && (
            <AuditLogDrawer
              auditLogs={auditLogs}
              onClose={() => setAuditDrawerOpen(false)}
            />
          )}
        </div>
      );
    }

    // ========================================================
    // 1. COORDINATOR COMMAND VIEW (CartoDB Map + Inspector Drawer)
    // ========================================================
    function CoordinatorCommandView({ requests, selectedRequest, onSelectRequest, inventory, volunteers, onRefresh }) {
      const mapContainerRef = useRef(null);
      const leafletMap = useRef(null);
      const markerGroup = useRef(null);

      const [detailData, setDetailData] = useState(null);
      const [loadingDetail, setLoadingDetail] = useState(false);
      const [showRawJson, setShowRawJson] = useState(false);
      const [actionNote, setActionNote] = useState('');
      const [approving, setApproving] = useState(false);

      // Fetch full request details + agent runs
      const loadDetail = async (requestId) => {
        setLoadingDetail(true);
        try {
          const res = await fetch(`${API_BASE}/api/requests/${requestId}`);
          if (res.ok) {
            const data = await res.json();
            setDetailData(data);
            onSelectRequest(data.request);
          }
        } catch (e) {
          console.error(e);
        } finally {
          setLoadingDetail(false);
        }
      };

      useEffect(() => {
        if (selectedRequest) {
          loadDetail(selectedRequest.id);
        }
      }, [selectedRequest?.id]);

      // Initialize Leaflet Map with CartoDB Positron Editorial tiles
      useEffect(() => {
        if (!mapContainerRef.current) return;
        if (!leafletMap.current) {
          leafletMap.current = L.map(mapContainerRef.current, {
            zoomControl: false,
            attributionControl: false
          }).setView([13.0827, 80.25], 11);

          // Free OpenStreetMap Standard Tiles (No API key, 100% reliable)
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
          }).addTo(leafletMap.current);

          L.control.zoom({ position: 'bottomright' }).addTo(leafletMap.current);
          markerGroup.current = L.layerGroup().addTo(leafletMap.current);
        }

        // Render tactical SVG markers
        if (markerGroup.current) {
          markerGroup.current.clearLayers();
          requests.forEach((r) => {
            const isSelected = selectedRequest?.id === r.id;
            const icon = createTacticalIcon(r.id, r.type, r.priority, isSelected);
            const marker = L.marker([r.latitude, r.longitude], { icon });

            marker.bindPopup(`
              <div class="mono text-xs">
                <div class="font-bold border-b border-stone-200 pb-1 mb-1">
                  [${r.id}] ${r.type.toUpperCase()} // ${r.priority}
                </div>
                <div class="font-sans font-semibold text-stone-900">${r.title}</div>
                <div class="text-stone-500 text-[11px] mt-0.5">${r.location_name}</div>
                <div class="mt-2 pt-1 border-t border-stone-200 flex justify-between font-mono text-[10px]">
                  <span>STATUS: ${r.status}</span>
                  <span class="text-orange-700 font-bold">${r.requires_human_review ? 'HUMAN GATE' : 'DISPATCHED'}</span>
                </div>
              </div>
            `);

            marker.on('click', () => {
              onSelectRequest(r);
            });

            markerGroup.current.addLayer(marker);
          });
        }
      }, [requests, selectedRequest?.id]);

      // Coordinator Override Action
      const handleOverride = async () => {
        if (!detailData) return;
        const reason = actionNote.trim() || prompt("Enter reason for manual override:");
        if (!reason) return;
        try {
          const res = await fetch(`${API_BASE}/api/requests/${detailData.request.id}/override`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              coordinator_id: 'USR_COORD',
              override_priority: detailData.request.priority,
              override_status: 'Dispatched',
              reason: reason,
              custom_instructions: actionNote || 'Direct manual override by human coordinator'
            })
          });
          if (res.ok) {
            await loadDetail(detailData.request.id);
            onRefresh();
            alert('Coordinator Override logged and enforced successfully.');
          }
        } catch (e) {
          alert('Override error: ' + e.message);
        }
      };

      // Human Approval Action
      const handleApprove = async () => {
        if (!detailData) return;
        setApproving(true);
        try {
          const runs = detailData.agent_runs || [];
          const resAgentRun = runs.find(r => r.step_name === 'Resource Allocation');
          const volAgentRun = runs.find(r => r.step_name === 'Volunteer Coordination');

          const proposedAllocations = resAgentRun?.output_data?.proposed_allocations || [];
          const proposedDispatches = volAgentRun?.output_data?.proposed_dispatches || [];

          const payload = {
            coordinator_id: 'USR_COORD',
            approved_priority: detailData.request.priority,
            approved_allocations: proposedAllocations,
            approved_dispatches: proposedDispatches,
            notes: actionNote || 'Chief Coordinator approved multi-agent allocation & authorized immediate field dispatch.'
          };

          const res = await fetch(`${API_BASE}/api/requests/${detailData.request.id}/approve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            await loadDetail(detailData.request.id);
            onRefresh();
          }
        } catch (e) {
          alert('Approval execution error: ' + e.message);
        } finally {
          setApproving(false);
        }
      };

      const req = detailData?.request || selectedRequest;
      const runs = detailData?.agent_runs || [];
      const analysisRun = runs.find(r => r.step_name === 'Request Analysis');
      const priorityRun = runs.find(r => r.step_name === 'Priority Assessment');
      const resourceRun = runs.find(r => r.step_name === 'Resource Allocation');
      const volunteerRun = runs.find(r => r.step_name === 'Volunteer Coordination');
      const deliveryRun = runs.find(r => r.step_name === 'Delivery Monitor');

      // Progress bar stage mapping
      const stages = ['Report', 'Validate', 'Prioritise', 'Match', 'Dispatch', 'Ack'];
      const statusIndexMap = {
        'Reported': 0,
        'Validated': 1,
        'Prioritised': 2,
        'Matched': 3,
        'Dispatched': 4,
        'Delivered': 4,
        'Acknowledged': 5,
        'Closed': 5
      };
      const currentStageIndex = req ? (statusIndexMap[req.status] ?? 0) : 0;

      return (
        <div className="flex-1 flex flex-col lg:flex-row h-[calc(100vh-48px)] overflow-hidden">
          {/* Main Tactical Map View (Left / Center) */}
          <div className="flex-1 relative flex flex-col bg-stone-200">
            <div ref={mapContainerRef} id="map" className="flex-1"></div>

            {/* Tactical Incident Selector Bar */}
            <div className="absolute top-3 left-3 z-[400] max-w-sm w-full bg-white border border-stone-800 p-2 text-xs">

                          <span className="mono text-[10px] text-stone-500 font-semibold">VALIDATION</span>
                        </div>
                        {analysisRun ? (

                              <span className={`font-bold ${analysisRun.output_data?.duplicate_check?.is_duplicate ? 'text-red-600' : 'text-emerald-700'}`}>
                                {analysisRun.output_data?.duplicate_check?.is_duplicate ? 'FLAGGED DUPLICATE' : 'UNIQUE FIELD REPORT'}

                            </div>
                            <div className="flex justify-between">
                              <span className="text-stone-500">MISSING FIELDS:</span>
                              <span className="text-stone-700">
                                {analysisRun.output_data?.missing_information?.length === 0 ? 'None (Complete)' : analysisRun.output_data?.missing_information?.join(', ')}
                              </span>
                            </div>

                        ) : <span className="mono text-stone-400">Analysis run pending...</span>}
                      </div>

                      {/* Dossier Card 2: Priority Assessment */}
                      <div className="bg-white border-crisp p-3">
                        <div className="flex items-center justify-between pb-1.5 border-b border-stone-200 mb-2">
                          <span className="mono font-bold text-[11px] text-stone-900">02 // PRIORITY ASSESSMENT AGENT</span>
                          <span className="mono text-[10px] text-orange-700 font-bold">requires_human_review</span>
                        </div>
                        {priorityRun ? (
                          <div className="space-y-1.5">
                            <div className="flex items-baseline justify-between mono text-[11px]">
                              <span className="text-stone-500">RECOMMENDED TIER:</span>
                              <span className="font-bold text-red-600">{priorityRun.output_data?.recommended_priority} (Score: {priorityRun.output_data?.urgency_score})</span>
                            </div>
                            <div className="bg-stone-50 p-2 border border-stone-200 text-stone-700 text-[11px] leading-relaxed">
                              <strong className="mono text-stone-900 block mb-0.5">RATIONALE:</strong>
                              {priorityRun.output_data?.reason}
                            </div>
                          </div>
                        ) : <span className="mono text-stone-400">Assessment pending...</span>}
                      </div>

                      {/* Dossier Card 3: Resource Allocation & Shortage */}
                      <div className="bg-white border-crisp p-3">
                        <div className="flex items-center justify-between pb-1.5 border-b border-stone-200 mb-2">
                          <span className="mono font-bold text-[11px] text-stone-900">03 // RESOURCE ALLOCATION AGENT</span>
                          <span className="mono text-[10px] text-stone-500 font-semibold">NGO STOCK MATCH</span>
                        </div>
                        {resourceRun ? (
                          <div className="space-y-2">
                            {/* Explicit Shortage Callout in Signal Crimson */}
                            {resourceRun.output_data?.shortages?.length > 0 && (
                              <div className="bg-red-50 border border-red-600 p-2.5">
                                <span className="mono text-[10px] font-bold text-red-700 uppercase block tracking-wider mb-1">
                                  CRITICAL SUPPLY SHORTAGE ALERT
                                </span>
                                {resourceRun.output_data.shortages.map((s, idx) => (
                                  <div key={idx} className="mono text-[11px] text-red-800 font-medium">
                                    [SHORTAGE] {s.item_name}: Missing {s.shortage_quantity} units ({s.reason})
                                  </div>
                                ))}
                              </div>
                            )}

                            {/* Proposed allocations table */}
                            <div className="divide-y divide-stone-100 border border-stone-200 mono text-[11px]">
                              {resourceRun.output_data?.proposed_allocations?.map((a, i) => (
                                <div key={i} className="p-1.5 flex justify-between items-center bg-stone-50">
                                  <span className="font-semibold text-stone-900">{a.item_name}</span>
                                  <span className="text-stone-700">{a.allocated_quantity} {a.unit}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        ) : <span className="mono text-stone-400">Resource matching pending...</span>}
                      </div>

                      {/* Dossier Card 4: Volunteer & Strict Vet Coordination */}
                      <div className="bg-white border-crisp p-3">
                        <div className="flex items-center justify-between pb-1.5 border-b border-stone-200 mb-2">
                          <span className="mono font-bold text-[11px] text-stone-900">04 // VOLUNTEER & VET AGENT</span>
                          <span className="mono text-[10px] text-stone-500 font-semibold">SKILL / PROXIMITY</span>
                        </div>
                        {volunteerRun ? (
                          <div className="space-y-2">
                            {volunteerRun.output_data?.strict_vet_compliance && (
                              <div className="bg-blue-50 border border-blue-600 p-2 text-blue-900 mono text-[11px] font-semibold">
                                ANIMAL PROTOCOL ENFORCED: Strictly assigned certified veterinary responder.
                              </div>
                            )}
                            {volunteerRun.output_data?.proposed_dispatches?.map((d, i) => (
                              <div key={i} className="p-2 border border-stone-200 bg-stone-50 mono text-[11px] space-y-0.5">
                                <div className="flex justify-between items-center">
                                  <span className="font-bold text-stone-900">{d.volunteer_name}</span>
                                  <span className="text-stone-500 font-medium">{d.distance_km} KM OUT</span>
                                </div>
                                <div className="text-stone-600 text-[10px]">ROLE: {d.role_type.toUpperCase()} · PHONE: {d.phone}</div>
                                {d.vet_license_no && (
                                  <div className="text-blue-700 font-bold text-[10px]">VET REGISTRATION: {d.vet_license_no}</div>
                                )}
                              </div>
                            ))}
                          </div>
                        ) : <span className="mono text-stone-400">Volunteer coordination pending...</span>}
                      </div>

                      {/* Package QR & Delivery Chain */}
                      {detailData?.packages?.length > 0 && (
                        <div className="bg-white border-crisp p-3">
                          <span className="mono text-[10px] uppercase font-bold text-stone-400 block mb-1">VERIFIED WAYBILL & QR</span>
                          <div className="flex items-center justify-between mono text-[11px]">
                            <span className="font-bold text-stone-900">{detailData.packages[0].qr_code}</span>
                            <span className={`px-1.5 py-0.5 font-bold ${

                            }`}>

                  )}
                </div>

                {/* Sticky Bottom Human Approval Gate Bar */}
                <div className="p-3.5 border-crisp-t bg-white flex flex-col space-y-2">
                  <div className="flex items-center justify-between mono text-[11px]">
                    <span className="font-bold text-stone-900 flex items-center space-x-1.5">
                      <span className="w-2 h-2 bg-orange-600 inline-block"></span>

                  />

                    >

    // ========================================================
    // 2. CITIZEN EMERGENCY INTAKE VIEW (Disaster Dispatch Card)
    // ========================================================
    function CitizenIntakeView({ offlineSimulated, onQueueOffline, onRefresh }) {
      const [type, setType] = useState('human');
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [locationName, setLocationName] = useState('Madhavaram Lake, Chennai');
      const [families, setFamilies] = useState(12);
      const [individuals, setIndividuals] = useState(48);
      const [animalSpecies, setAnimalSpecies] = useState('Dairy Cattle & Canines');
      const [animalCount, setAnimalCount] = useState(8);
      const [selectedResources, setSelectedResources] = useState(['Drinking Water', 'Food Packets']);
      const [receiptCode, setReceiptCode] = useState(null);
      const [ackQrInput, setAckQrInput] = useState('');
      const [ackResult, setAckResult] = useState('');

      const humanItems = ['Drinking Water', 'Food Packets', 'Medical Kits', 'Blankets', 'Rescue Boat'];
      const animalItems = ['Veterinary Care', 'Cattle Fodder & Feed', 'Animal Antiseptic & Bandages', 'Animal Shelter Tarps'];

      const toggleItem = (item) => {
        if (selectedResources.includes(item)) {
          setSelectedResources(selectedResources.filter(x => x !== item));
        } else {
          setSelectedResources([...selectedResources, item]);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const payload = {
          type,
          title: title || `${type === 'animal' ? 'Animal Emergency' : 'Flood Inundation'} at ${locationName}`,
          description,
          disaster_type: 'Flood',
          location_name: locationName,
          latitude: 13.0827 + (Math.random() - 0.5) * 0.08,
          longitude: 80.2707 + (Math.random() - 0.5) * 0.08,
          affected_families: type === 'human' ? Number(families) : 0,
          affected_individuals: type === 'human' ? Number(individuals) : 0,
          animal_species: type === 'animal' ? animalSpecies : null,
          animal_count: type === 'animal' ? Number(animalCount) : 0,
          resources_needed: selectedResources,
          created_by: 'USR_CITIZEN1'
        };

        if (offlineSimulated) {
          const offlineId = `OFF-${Date.now().toString().slice(-6)}`;
          onQueueOffline({ ...payload, offline_id: offlineId });
          setReceiptCode(offlineId);
          setTitle('');
          setDescription('');
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/api/requests`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            const data = await res.json();
            setReceiptCode(data.request_id);
            setTitle('');
            setDescription('');
            onRefresh();
          }
        } catch (err) {
          alert('Submission error: ' + err.message);
        }
      };

      const handleConfirmReceipt = async () => {
        if (!ackQrInput) return;
        try {
          const res = await fetch(`${API_BASE}/api/deliveries/acknowledge`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              qr_code: ackQrInput.trim(),
              recipient_ack: true,
              ack_signature: 'Verified Citizen Digital Handoff',
              ack_notes: 'All items verified on site.'
            })
          });
          if (res.ok) {
            setAckResult(`RELIEF DELIVERY CONFIRMED & SEALED FOR ${ackQrInput}`);
            setAckQrInput('');
            onRefresh();
          } else {
            const err = await res.json();
            alert('Acknowledge failed: ' + (err.detail || 'Code not found'));
          }
        } catch (e) {
          alert(e.message);
        }
      };

      return (
        <div className="max-w-5xl mx-auto w-full p-4 lg:p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
          {/* Intake Dispatch Card (7 cols) */}
          <div className="md:col-span-7 bg-white border-crisp p-5">
            <div className="border-b border-stone-200 pb-3 mb-4 flex items-center justify-between">
              <div>
                <span className="mono text-[10px] text-stone-500 font-bold block uppercase tracking-wider">OFFICIAL INTAKE CARD</span>
                <h1 className="text-base font-bold text-stone-900 tracking-tight">Citizen Emergency Dispatch Request</h1>
              </div>
              <div className="flex border border-stone-800">
                <button
                  type="button"
                  onClick={() => { setType('human'); setSelectedResources(['Drinking Water', 'Food Packets']); }}
                  className={`px-3 py-1 mono text-xs font-bold transition-all ${
                    type === 'human' ? 'bg-stone-900 text-white' : 'bg-white text-stone-700 hover:bg-stone-100'
                  }`}
                >
                  HUMAN
                </button>
                <button
                  type="button"
                  onClick={() => { setType('animal'); setSelectedResources(['Veterinary Care', 'Cattle Fodder & Feed']); }}
                  className={`px-3 py-1 mono text-xs font-bold transition-all border-l border-stone-800 ${
                    type === 'animal' ? 'bg-blue-700 text-white' : 'bg-white text-stone-700 hover:bg-stone-100'
                  }`}
                >
                  ANIMAL / VET
                </button>
              </div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              <div>
                <label className="mono font-bold text-stone-700 block mb-1">INCIDENT TITLE / SUBJECT</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Inundated streets, rooftop rescue needed"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900 mono"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="mono font-bold text-stone-700 block mb-1">GEOGRAPHIC LOCATION / LANDMARK</label>
                  <input
                    type="text"
                    required
                    value={locationName}
                    onChange={(e) => setLocationName(e.target.value)}
                    className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900 mono"
                  />
                </div>

                {type === 'human' ? (
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="mono font-bold text-stone-700 block mb-1">FAMILIES</label>
                      <input
                        type="number"
                        min="1"
                        value={families}
                        onChange={(e) => setFamilies(e.target.value)}
                        className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900 mono"
                      />
                    </div>
                    <div>
                      <label className="mono font-bold text-stone-700 block mb-1">INDIVIDUALS</label>
                      <input
                        type="number"
                        min="1"
                        value={individuals}
                        onChange={(e) => setIndividuals(e.target.value)}
                        className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900 mono"
                      />
                    </div>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="mono font-bold text-stone-700 block mb-1">SPECIES</label>
                      <input
                        type="text"
                        value={animalSpecies}
                        onChange={(e) => setAnimalSpecies(e.target.value)}
                        className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900 mono"
                      />
                    </div>
                    <div>
                      <label className="mono font-bold text-stone-700 block mb-1">COUNT</label>
                      <input
                        type="number"
                        min="1"
                        value={animalCount}
                        onChange={(e) => setAnimalCount(e.target.value)}
                        className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900 mono"
                      />
                    </div>
                  </div>
                )}
              </div>

              <div>
                <label className="mono font-bold text-stone-700 block mb-1">HAZARDS / SITUATIONAL DETAILS</label>
                <textarea
                  rows="3"
                  placeholder="Water level, submerged roads, vulnerable persons, injuries..."
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900"
                ></textarea>
              </div>

              <div>
                <label className="mono font-bold text-stone-700 block mb-1.5">RELIEF SUPPLIES REQUIRED</label>
                <div className="flex flex-wrap gap-1.5">
                  {(type === 'human' ? humanItems : animalItems).map(item => (
                    <button
                      type="button"
                      key={item}
                      onClick={() => toggleItem(item)}
                      className={`mono text-[11px] px-2.5 py-1 border transition-all ${
                        selectedResources.includes(item)
                          ? 'bg-stone-900 text-white border-stone-900 font-bold'
                          : 'bg-stone-50 text-stone-700 border-stone-300 hover:border-stone-400'
                      }`}
                    >
                      {selectedResources.includes(item) ? '[X] ' : '[ ] '} {item}
                    </button>
                  ))}
                </div>
              </div>

              <div className="pt-2">
                <button
                  type="submit"
                  className="w-full hard-btn-primary py-2.5 text-xs font-bold mono uppercase tracking-wider tactile-btn"
                >
                  {offlineSimulated ? 'STORE TO OFFLINE QUEUE' : 'TRANSMIT EMERGENCY REPORT'}
                </button>
              </div>
            </form>
          </div>

          {/* Receipt & Delivery Acknowledgment (5 cols) */}
          <div className="md:col-span-5 space-y-4">
            {/* Generated Receipt Ticket */}
            {receiptCode && (
              <div className="bg-white border-2 border-stone-900 p-4 mono text-xs">
                <div className="flex items-center justify-between border-b border-stone-900 pb-2 mb-2 font-bold">
                  <span>DISPATCH MANIFEST TICKET</span>
                  <span className="bg-stone-900 text-white px-1">{receiptCode}</span>
                </div>
                <p className="text-stone-600 text-[11px] mb-3">
                  {offlineSimulated
                    ? 'Saved to device storage. Auto-sync will deliver when network is restored.'
                    : 'Report ingested by Chief Coordinator. Multi-agent validation in progress.'}
                </p>
                <button
                  onClick={() => { navigator.clipboard.writeText(receiptCode); alert('Ticket ID copied to clipboard'); }}
                  className="w-full hard-btn-secondary py-1 text-xs mono font-bold tactile-btn"
                >
                  COPY TRACKING CODE
                </button>
              </div>
            )}

            {/* Recipient Delivery Handoff Card */}
            <div className="bg-white border-crisp p-4">
              <span className="mono text-[10px] text-stone-500 font-bold block uppercase tracking-wider">CHAIN OF CUSTODY</span>
              <h3 className="font-bold text-stone-900 text-sm mb-1">Confirm Delivery Receipt</h3>
              <p className="text-stone-600 text-xs mb-3">
                Seal the traceable chain by acknowledging the QR pass code on delivered aid supplies.
              </p>

              <div className="space-y-2 text-xs">
                <input
                  type="text"
                  placeholder="Enter or scan QR code (e.g. RESQ-REQ001-XXXX)"
                  value={ackQrInput}
                  onChange={(e) => setAckQrInput(e.target.value)}
                  className="w-full border border-stone-300 p-2 mono text-stone-900 focus:outline-none focus:border-stone-900"
                />

                <div className="flex space-x-2">
                  <button
                    onClick={handleConfirmReceipt}
                    className="flex-1 hard-btn-dark py-2 text-xs font-bold mono uppercase tracking-wider tactile-btn"
                  >
                    CONFIRM & SIGN
                  </button>
                  <button
                    onClick={() => setAckQrInput('RESQ-REQ001-DEMO')}
                    className="hard-btn-secondary px-2.5 py-2 text-[11px] mono tactile-btn"
                    title="Quick demo QR code"
                  >
                    DEMO QR
                  </button>
                </div>

                {ackResult && (
                  <div className="p-2 border border-emerald-700 bg-emerald-50 text-emerald-900 mono text-[11px] font-bold">
                    {ackResult}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========================================================
    // 3. NGO INVENTORY LEDGER (Financial-grade Dense Table)
    // ========================================================
    function NGOInventoryLedger({ inventory, onRefresh }) {
      const [itemName, setItemName] = useState('');
      const [category, setCategory] = useState('Medical');
      const [quantity, setQuantity] = useState(100);
      const [unit, setUnit] = useState('kits');
      const [locationName, setLocationName] = useState('Red Cross Warehouse Royapettah');
      const [adding, setAdding] = useState(false);

      const handleAddItem = async (e) => {
        e.preventDefault();
        setAdding(true);
        try {
          const res = await fetch(`${API_BASE}/api/inventory`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ngo_id: 'USR_NGO1',
              item_name: itemName,
              category,
              quantity: Number(quantity),
              unit,
              location_name: locationName
            })
          });
          if (res.ok) {
            setItemName('');
            onRefresh();
          }
        } catch (e) {
          alert(e.message);
        } finally {
          setAdding(false);
        }
      };

      return (
        <div className="max-w-7xl mx-auto w-full p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
          {/* Main Ledger (8 cols) */}
          <div className="lg:col-span-8 bg-white border-crisp p-4">
            <div className="border-b border-stone-200 pb-3 mb-3 flex items-center justify-between">
              <div>
                <span className="mono text-[10px] text-stone-500 font-bold block uppercase tracking-wider">STOCK RESERVATION LEDGER</span>
                <h2 className="text-base font-bold text-stone-900">Relief Inventory & Warehouse Allocation</h2>
              </div>
              <span className="mono text-xs font-bold border border-stone-800 bg-stone-100 px-2 py-0.5">
                {inventory.length} CATALOG SKUS
              </span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left mono text-xs">
                <thead>
                  <tr className="border-b border-stone-300 text-stone-500 text-[10px] uppercase">
                    <th className="py-2 px-2.5">SKU / ITEM</th>
                    <th className="py-2 px-2.5">CATEGORY</th>
                    <th className="py-2 px-2.5 text-right">TOTAL</th>
                    <th className="py-2 px-2.5 text-right">RESERVED</th>
                    <th className="py-2 px-2.5 text-right">NET AVAIL</th>
                    <th className="py-2 px-2.5">STATUS</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-200">
                  {inventory.map(item => {
                    const available = item.quantity - (item.reserved_quantity || 0);
                    const isShortage = available <= 10;
                    const pct = Math.min(Math.round(((item.reserved_quantity || 0) / item.quantity) * 100), 100);

                    return (
                      <tr key={item.id} className="hover:bg-stone-50">
                        <td className="py-2.5 px-2.5 font-bold text-stone-900">
                          {item.item_name}
                          <span className="block text-[10px] text-stone-500 font-normal">{item.location_name}</span>
                        </td>
                        <td className="py-2.5 px-2.5 text-stone-600">{item.category}</td>
                        <td className="py-2.5 px-2.5 text-right">{item.quantity}</td>
                        <td className="py-2.5 px-2.5 text-right text-orange-700 font-bold">{item.reserved_quantity || 0}</td>
                        <td className="py-2.5 px-2.5 text-right font-bold">
                          <span className={isShortage ? 'text-red-600' : 'text-stone-900'}>
                            {available} {item.unit}
                          </span>
                        </td>
                        <td className="py-2.5 px-2.5">
                          {isShortage ? (
                            <span className="bg-red-50 text-red-700 border border-red-600 px-1.5 py-0.5 text-[10px] font-bold">
                              SHORTAGE
                            </span>
                          ) : (
                            <span className="bg-emerald-50 text-emerald-800 border border-emerald-600 px-1.5 py-0.5 text-[10px] font-bold">
                              OPTIMAL
                            </span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Add Stock Form (4 cols) */}
          <div className="lg:col-span-4 bg-white border-crisp p-4">
            <span className="mono text-[10px] text-stone-500 font-bold block uppercase tracking-wider">INTAKE REPLENISHMENT</span>
            <h3 className="font-bold text-stone-900 text-sm mb-3">Register New Supply Batch</h3>

            <form onSubmit={handleAddItem} className="space-y-3 mono text-xs">
              <div>
                <label className="text-stone-700 font-bold block mb-1">ITEM NAME</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Trauma First Aid Kits"
                  value={itemName}
                  onChange={(e) => setItemName(e.target.value)}
                  className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900"
                />
              </div>

              <div>
                <label className="text-stone-700 font-bold block mb-1">CATEGORY</label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900 bg-white"
                >
                  <option value="Medical">Medical Supplies</option>
                  <option value="Food">Food Packets</option>
                  <option value="Water">Drinking Water</option>
                  <option value="Shelter">Shelter & Blankets</option>
                  <option value="Veterinary">Veterinary / Animal Feed</option>
                </select>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-stone-700 font-bold block mb-1">QUANTITY</label>
                  <input
                    type="number"
                    min="1"
                    value={quantity}
                    onChange={(e) => setQuantity(e.target.value)}
                    className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900"
                  />
                </div>
                <div>
                  <label className="text-stone-700 font-bold block mb-1">UNIT</label>
                  <input
                    type="text"
                    value={unit}
                    onChange={(e) => setUnit(e.target.value)}
                    className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900"
                  />
                </div>
              </div>

              <div>
                <label className="text-stone-700 font-bold block mb-1">WAREHOUSE SECTOR</label>
                <input
                  type="text"
                  value={locationName}
                  onChange={(e) => setLocationName(e.target.value)}
                  className="w-full border border-stone-300 p-2 text-stone-900 focus:outline-none focus:border-stone-900"
                />
              </div>

              <button
                type="submit"
                disabled={adding}
                className="w-full hard-btn-dark py-2 text-xs font-bold uppercase tracking-wider tactile-btn mt-2"
              >
                {adding ? 'CATALOGING...' : 'REGISTER STOCK SKU'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ========================================================
    // 4. VOLUNTEER & VET FIELD APP (Manifest Cards & Waybill QR)
    // ========================================================
    function VolunteerVetFieldApp({ volunteers, onRefresh }) {
      const [selectedVolId, setSelectedVolId] = useState('VOL001');
      const [tasks, setTasks] = useState([]);
      const qrTargetRef = useRef(null);
      const [activeModalQr, setActiveModalQr] = useState(null);

      const activeVolunteer = volunteers.find(v => v.id === selectedVolId) || volunteers[0];

      const fetchTasks = async (volId) => {
        if (!volId) return;
        try {
          const res = await fetch(`${API_BASE}/api/volunteers/${volId}/tasks`);
          if (res.ok) {
            setTasks(await res.json());
          }
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => {
        if (activeVolunteer) {
          fetchTasks(activeVolunteer.id);
        }
      }, [selectedVolId, volunteers]);

      useEffect(() => {
        if (activeModalQr && qrTargetRef.current) {
          qrTargetRef.current.innerHTML = '';
          new QRCode(qrTargetRef.current, {
            text: activeModalQr,
            width: 180,
            height: 180,
            colorDark: "#111111",
            colorLight: "#FFFFFF",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      }, [activeModalQr]);

      return (
        <div className="max-w-6xl mx-auto w-full p-4 lg:p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
          {/* Identity & Status Sidebar (4 cols) */}
          <div className="md:col-span-4 bg-white border-crisp p-4 space-y-4">
            <div>
              <span className="mono text-[10px] text-stone-500 font-bold block uppercase tracking-wider">FIELD RESPONDER ROSTER</span>
              <h2 className="text-base font-bold text-stone-900">Mission Personnel Profile</h2>
            </div>

            <div className="space-y-1 mono text-xs">
              <label className="text-stone-700 font-bold block">SELECT OPERATIVE:</label>
              <select
                value={selectedVolId}
                onChange={(e) => setSelectedVolId(e.target.value)}
                className="w-full border border-stone-800 p-2 font-bold bg-white text-stone-900 focus:outline-none"
              >
                {volunteers.map(v => (
                  <option key={v.id} value={v.id}>
                    {v.name} {v.is_vet ? '// [CERTIFIED VET]' : '// [FIELD VOLUNTEER]'}
                  </option>
                ))}
              </select>
            </div>

            {activeVolunteer && (
              <div className="border border-stone-300 p-3 bg-stone-50 mono text-xs space-y-2">
                <div className="flex justify-between items-center border-b border-stone-200 pb-1.5">
                  <span className="font-bold text-stone-900">{activeVolunteer.name}</span>
                  <span className={`px-1.5 py-0.5 font-bold ${
                    activeVolunteer.is_vet ? 'bg-blue-100 text-blue-900' : 'bg-stone-200 text-stone-800'
                  }`}>
                    {activeVolunteer.is_vet ? 'CERTIFIED VET' : 'VOLUNTEER'}
                  </span>
                </div>
                {activeVolunteer.is_vet && (
                  <div className="text-blue-800 font-bold text-[11px]">
                    REGISTRATION: {activeVolunteer.vet_license_no || 'TN-VET-ACTIVE'}
                  </div>
                )}
                <div className="text-stone-600 text-[11px]">
                  SECTOR BASE: {activeVolunteer.current_location}
                </div>
                <div>
                  <span className="text-stone-500 text-[10px] uppercase font-bold block mb-1">VERIFIED SKILLS:</span>
                  <div className="flex flex-wrap gap-1">
                    {(activeVolunteer.skills || []).map((s, idx) => (
                      <span key={idx} className="bg-white border border-stone-300 text-stone-800 px-1.5 py-0.5 text-[10px]">
                        {s}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Mission Manifest Cards (8 cols) */}
          <div className="md:col-span-8 bg-white border-crisp p-4">
            <div className="border-b border-stone-200 pb-3 mb-3 flex items-center justify-between">
              <div>
                <span className="mono text-[10px] text-stone-500 font-bold block uppercase tracking-wider">DISPATCH ORDERS</span>
                <h3 className="text-base font-bold text-stone-900">Active Field Missions & Waybills</h3>
              </div>
              <span className="mono text-xs font-bold border border-stone-800 bg-stone-100 px-2 py-0.5">
                {tasks.length} ASSIGNED
              </span>
            </div>

            {tasks.length === 0 ? (
              <div className="p-8 text-center mono text-xs text-stone-400">
                NO ACTIVE FIELD DISPATCHES FOR THIS OPERATIVE.
              </div>
            ) : (
              <div className="space-y-3">
                {tasks.map(t => (
                  <div key={t.id} className="border border-stone-300 p-3 bg-stone-50 text-xs flex flex-col md:flex-row md:items-center justify-between gap-3">
                    <div className="space-y-1">
                      <div className="flex items-center space-x-2">
                        <span className="mono font-bold text-stone-900 bg-stone-200 px-1">{t.request_id}</span>
                        <span className="font-bold text-stone-900">{t.title}</span>
                      </div>
                      <div className="mono text-stone-600 text-[11px]">DESTINATION: {t.location_name}</div>
                      <div className="mono text-[11px] text-stone-500">
                        STATUS: <strong className="text-orange-700">{t.status.toUpperCase()}</strong> · WAYBILL: {t.delivery_status || 'PREPARED'}
                      </div>
                    </div>

                    {t.qr_code && (
                      <div className="flex items-center space-x-2">
                        <button
                          onClick={() => setActiveModalQr(t.qr_code)}
                          className="hard-btn-primary py-1.5 px-3 text-xs mono font-bold uppercase tracking-wider tactile-btn whitespace-nowrap"
                        >
                          SHOW WAYBILL QR
                        </button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {/* Tactical QR Pass Modal */}
            {activeModalQr && (
              <div className="fixed inset-0 bg-stone-900/80 z-50 flex items-center justify-center p-4">
                <div className="bg-white border-2 border-stone-900 max-w-sm w-full p-5 flex flex-col items-center text-center space-y-3">
                  <span className="mono text-[10px] text-stone-500 font-bold block uppercase tracking-wider">WAYBILL PASS // UN-DRR</span>
                  <h4 className="font-bold text-stone-900 text-sm">Relief Delivery Verification QR</h4>
                  <p className="text-stone-600 text-xs">
                    Present this code to the community leader or recipient for digital scan.
                  </p>
                  <div className="p-2 border border-stone-300 bg-white" ref={qrTargetRef}></div>
                  <div className="mono font-bold text-xs bg-stone-100 border border-stone-300 px-3 py-1 text-stone-900">
                    {activeModalQr}
                  </div>
                  <div className="flex space-x-2 w-full pt-2">
                    <button
                      onClick={async () => {
                        // Quick 1-click simulate field scan
                        try {
                          await fetch(`${API_BASE}/api/deliveries/acknowledge`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                              qr_code: activeModalQr,
                              recipient_ack: true,
                              ack_signature: 'Verified Field Scanner Handshake'
                            })
                          });
                          alert('Field delivery successfully confirmed & acknowledged on-site!');
                          setActiveModalQr(null);
                          onRefresh();
                        } catch (e) {
                          alert(e.message);
                        }
                      }}
                      className="flex-1 hard-btn-primary py-2 text-xs mono font-bold tactile-btn"
                    >
                      SIMULATE FIELD SCAN
                    </button>
                    <button
                      onClick={() => setActiveModalQr(null)}
                      className="hard-btn-secondary px-3 py-2 text-xs mono font-bold tactile-btn"
                    >
                      CLOSE
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================================================
    // AUDIT LOG DRAWER (Minimal Swiss Typography)
    // ========================================================
    function AuditLogDrawer({ auditLogs, onClose }) {
      return (
        <div className="fixed inset-0 bg-stone-900/70 z-50 flex justify-end">
          <div className="bg-white border-l border-stone-900 w-full max-w-xl h-full flex flex-col p-5 shadow-none">
            <div className="flex items-center justify-between pb-3 border-b border-stone-300">
              <div>
                <span className="mono text-[10px] text-stone-500 font-bold block uppercase tracking-wider">IMMUTABLE LOGGING</span>
                <h3 className="font-bold text-stone-900 text-base">End-to-End Audit Ledger</h3>
              </div>
              <button onClick={onClose} className="mono text-stone-600 hover:text-stone-900 text-lg font-bold">&times;</button>
            </div>

            <div className="flex-1 overflow-y-auto mt-4 space-y-3 mono text-xs pr-1">
              <span className="text-[11px] font-bold text-stone-400 uppercase tracking-wider block">HUMAN GATES & EVENTS</span>
              {(auditLogs.request_events || []).map((ev, i) => (
                <div key={i} className="border border-stone-300 p-2.5 bg-stone-50 space-y-1">
                  <div className="flex justify-between font-bold text-stone-900">
                    <span>{ev.event_type} // {ev.request_id}</span>
                    <span className="text-[10px] text-stone-500">{ev.created_at}</span>
                  </div>
                  <div className="text-[11px] text-stone-600">ACTOR: {ev.actor_role} ({ev.actor_id})</div>
                  <pre className="text-[10px] bg-white border border-stone-200 p-1.5 overflow-x-auto text-stone-800">
                    {ev.details}
                  </pre>
                </div>
              ))}

              <span className="text-[11px] font-bold text-stone-400 uppercase tracking-wider block pt-3">SPECIALIST AGENT RUN LOGS</span>
              {(auditLogs.agent_runs || []).map((run, i) => (
                <div key={i} className="border border-stone-300 p-2.5 bg-stone-50 space-y-1">
                  <div className="flex justify-between font-bold text-stone-900">
                    <span>{run.step_name}</span>
                    <span className={`text-[10px] px-1 py-0.2 ${run.human_approved ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                      {run.human_approved ? 'APPROVED' : 'PENDING'}
                    </span>
                  </div>
                  <div className="text-[10px] text-stone-500">REQUEST ID: {run.request_id}</div>
                  <pre className="text-[10px] bg-white border border-stone-200 p-1.5 overflow-x-auto max-h-32 text-stone-800">
                    {JSON.stringify(run.output_data, null, 2)}
                  </pre>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
